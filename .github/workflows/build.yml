# This is a basic workflow to help you get started with Actions

name: CI

on:
  push:
    tags: [ "*" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: oven-sh/setup-bun@v2
    
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: 25
        distribution: 'temurin'
        
    - name: Install required packages
      run: |
        sudo apt update -y
        sudo apt install -y apksigner
        sudo apt install -y npm
        sudo npm install -g pnpm
        
    - name: Set up keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" > keystore.txt
        base64 --decode keystore.txt > keystore.jks
        
    - name: Create artifacts
      run: |
        git clone https://github.com/Ammar64/Sharing
        cd Sharing
        sed -i 's/applicationId = "com.ammar.sharing"/applicationId = "com.ammar.sharing.debug.latest"/g' app/build.gradle.kts
        sed -i 's/sharing/sharing debug/g' app/src/main/res/values/strings.xml
        pnpm install -C ./web/frontend
        ./gradlew assembleRelease
        VERSION_NAME=$(grep '^versionName=' app/version.txt | cut -d'=' -f2)
        echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
        apksigner sign --v4-signing-enabled --ks ../keystore.jks --ks-pass pass:${{ secrets.KEYSTORE_PASS }} --key-pass pass:${{ secrets.KEY_PASS }} app/build/outputs/apk/release/app-release-unsigned.apk
        mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/Sharing_debug-${VERSION_NAME}.apk
        
    - name: Upload Android artifacts
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: Sharing/app/build/outputs/apk/release/Sharing_debug-${{ env.VERSION_NAME }}.apk
        tag: ${{ github.ref }}
        release_name: "Sharing_debug-${{ env.VERSION_NAME }}"
        body: |
          This is the build of the latest commit in https://github.com/Ammar64/Sharing
