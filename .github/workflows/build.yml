# This is a basic workflow to help you get started with Actions

name: CI

on:
  push:
    tags: [ "*" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 17
      uses: actions/setup-java@v1
      with:
        java-version: 17
    - name: Set up keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" > keystore.txt
        base64 --decode keystore.txt > keystore.jks
    - name: Create artifacts
      run: |
        git clone --depth=1 https://github.com/Ammar64/Sharing
        cd Sharing
        sed -i 's/applicationId "com.ammar.sharing"/applicationId "com.ammar.sharing.debug.latest"/g' app/build.gradle
        sed -i 's/Sharing/Sharing debug/g' android/res/values/strings.xml
        pnpm install --prefix ./web
        ./gradlew assembleRelease
        VERSION_NAME=$(grep '^versionName=' version.txt | cut -d'=' -f2)
        echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
        apksigner sign --v4-signing-enabled --ks ../keystore.jks --ks-pass pass:${secrets.KEYSTORE_PASS} --key-pass pass:${secrets.KEY_PASS} app/build/outputs/apk/release/app-release-unsigned.apk
        mv app/build/outputs/apk/release/app-release-unsigned.apk android/build/outputs/apk/release/Sharing_debug-${VERSION_NAME}.apk
    - name: Upload Android artifacts
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: Sharing/app/build/outputs/apk/release/Sharing_debug-${{ env.VERSION_NAME }}.apk
        tag: ${{ github.ref }}
        release_name: "Sharing_debug-${{ env.VERSION_NAME }}"
        body: |
          This is the build of the latest commit in https://github.com/Ammar64/Sharing
